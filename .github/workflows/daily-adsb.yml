# Daily ADS-B data job: builds yesterday (and any missing day of the last 30) for Catalonia + Andorra
# and uploads it to the R2 bucket behind https://doppler-data.azemar.eu. Secrets: CLOUDFLARE_API_TOKEN (Workers R2 Storage: Edit).
name: daily-adsb-data
on:
  schedule:
    - cron: "30 6 * * *"   # 06:30 UTC: adsb.lol publishes day D on D+1 between ~00:20 and 03:30 UTC
  workflow_dispatch:
    inputs:
      date:
        description: "Build only this UTC day (YYYY-MM-DD); empty = catch-up of the last 30 days"
        required: false
        default: ""
permissions:
  contents: read
# Shared with backfill.yml's `manifest` job: only one writer of the R2 availability manifest (meta/coverage.json)
# at a time. cancel-in-progress: false, so a run waits instead of cancelling. (GitHub keeps one *pending* entry per
# group; a superseded pending entry is harmless because every run ends with a full --rebuild-manifest.)
concurrency: { group: adsb-r2-manifest, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - name: Install pinned, hash-locked wheels
        timeout-minutes: 10
        run: 'pip install --require-hashes --only-binary=:all: --no-deps -r ref/data/requirements-ci.txt'
      # fail in seconds (not after hours of streaming) if the token, account or bucket is wrong
      - name: R2 self-test (PUT/GET/DELETE a probe key)
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a1cd2a86a35ae7d3f0d9ec23c95ac31e
        run: python ref/data/daily_job.py --r2-selftest
      # keep the small per-day trace counts (<tag>.counts.json) between runs: reference for the partial-day check
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/adsb/*.counts.json
          key: adsb-counts-${{ github.run_id }}
          restore-keys: adsb-counts-
      - name: Build + upload missing days (catch-up over the last 30 days; at most 5 per run)
        timeout-minutes: 280
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a1cd2a86a35ae7d3f0d9ec23c95ac31e
          GITHUB_TOKEN: ${{ github.token }}  # read-only (permissions above); GitHub API rate limit
          PROJ_NETWORK: "ON"
          ONE_DATE: ${{ inputs.date }}
        run: |
          # --max-time: stop starting new days in time for the manifest rebuild below (job timeout 300)
          if [ -n "$ONE_DATE" ]; then python ref/data/daily_job.py --max-time 260 --date "$ONE_DATE"
          else python ref/data/daily_job.py --max-time 260 --days 30 --max-days 5; fi
      # Rewrite the availability manifest (meta/coverage.json, read by the app's date gate) from what the Worker
      # actually serves: repairs a day lost to a concurrent manifest write (e.g. a local backfill running in parallel).
      - name: Rebuild the data availability manifest
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a1cd2a86a35ae7d3f0d9ec23c95ac31e
          GITHUB_TOKEN: ${{ github.token }}  # read-only (permissions above); GitHub API rate limit
        run: python ref/data/daily_job.py --rebuild-manifest
