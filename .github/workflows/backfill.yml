# One-off parallel backfill of the ADS-B day archive (Catalonia + Andorra) into R2.
# Manual trigger only. Each matrix job builds a slice of the missing days with ref/data/daily_job.py
# (which skips days the Worker already serves); a final job rebuilds the availability manifest.
name: backfill-adsb-data
on:
  workflow_dispatch:
    inputs:
      from:
        description: "First UTC day (YYYY-MM-DD, oldest)"
        required: true
        default: "2025-11-07"
      to:
        description: "Last UTC day (YYYY-MM-DD, newest)"
        required: true
        default: "2026-11-06"
      jobs:
        description: "Parallel jobs (1-20)"
        required: true
        default: "20"
permissions:
  contents: read
concurrency: { group: backfill-adsb-data, cancel-in-progress: false }
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      slices: ${{ steps.p.outputs.slices }}
    steps:
      - id: p
        env:
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
          NJOBS: ${{ inputs.jobs }}
        run: |
          python3 - <<'EOF'
          import datetime as d, json, os, re, urllib.request
          a, b, n = os.environ["FROM"], os.environ["TO"], os.environ["NJOBS"]
          assert re.fullmatch(r"\d{4}-\d{2}-\d{2}", a) and re.fullmatch(r"\d{4}-\d{2}-\d{2}", b) and re.fullmatch(r"\d{1,2}", n)
          a, b, n = d.date.fromisoformat(a), d.date.fromisoformat(b), max(1, min(20, int(n)))
          assert d.date(2023, 2, 16) <= a <= b and (b - a).days <= 800
          req = urllib.request.Request("https://doppler-data.azemar.eu/adsb/index/meta/coverage.json", headers={"User-Agent": "doppler-backfill"})
          try: have = set(json.load(urllib.request.urlopen(req, timeout=30)).get("days", []))
          except Exception: have = set()
          days = [str(b - d.timedelta(i)) for i in range((b - a).days + 1)]
          days = [x for x in days if x not in have]
          slices = [days[i::n] for i in range(n)]
          slices = [" ".join(s) for s in slices if s]
          print(f"{len(days)} missing days in {len(slices)} slices")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f: f.write("slices=" + json.dumps(slices) + "\n")
          EOF
  build:
    needs: plan
    if: needs.plan.outputs.slices != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        slice: ${{ fromJSON(needs.plan.outputs.slices) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - run: pip install numpy requests pyproj
      - run: npm install --no-save wrangler@4
      - name: Build + upload this slice
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a1cd2a86a35ae7d3f0d9ec23c95ac31e
          PROJ_NETWORK: "ON"
          SLICE: ${{ matrix.slice }}
        run: |
          args=()
          for x in $SLICE; do [[ "$x" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] && args+=(--date "$x"); done
          python ref/data/daily_job.py "${args[@]}"
  manifest:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - run: pip install numpy requests pyproj
      - run: npm install --no-save wrangler@4
      - name: Rebuild the availability manifest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a1cd2a86a35ae7d3f0d9ec23c95ac31e
        run: python ref/data/daily_job.py --rebuild-manifest
